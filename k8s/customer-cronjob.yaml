apiVersion: batch/v1
kind: CronJob
metadata:
  name: regular-customer
  labels:
    app: regular-customer
spec:
  schedule: "*/1 * * * *" # Arrives every minute (morning commute)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: matcha-customer
        spec:
          restartPolicy: OnFailure
          containers:
            - name: customer
              image: matcha-cafe:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "-u", "client.py"]
              envFrom:
                - configMapRef:
                    name: cafe-config
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "128Mi"
                  cpu: "200m"
