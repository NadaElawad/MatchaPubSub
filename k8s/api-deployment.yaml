apiVersion: apps/v1
kind: Deployment
metadata:
  name: matcha-order-api
  labels:
    app: matcha-order-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matcha-order-api
  template:
    metadata:
      labels:
        app: matcha-order-api
    spec:
      containers:
        - name: api
          image: matcha-cafe:v12
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: cafe-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: matcha-order-api
  labels:
    app: matcha-order-api
spec:
  type: ClusterIP
  selector:
    app: matcha-order-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
